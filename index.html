<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Ruleta Decide</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;touch-action:manipulation;overscroll-behavior:contain;}
body{margin:0;color:#f3edff;font-family:-apple-system,"SF Pro Display",Segoe UI,sans-serif;
  background:#08060f;display:flex;justify-content:center;}
#app{width:100%;max-width:420px;min-height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#3a1e78,#0a5fb0,#a4218f,#0f8a5a,#3a1e78);
  background-size:400% 400%;animation:flow 22s ease-in-out infinite;
  display:flex;flex-direction:column;padding:14px 14px 0;}
@keyframes flow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes waveFixed{0%,100%{background-position:0% 30%;}50%{background-position:100% 70%;}}
@keyframes diagMoveApp{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.btn{border-color:rgba(58,160,255,.4);}
.btn.active{background:#1e90ff;border-color:#1e90ff;color:#fff;}
.chip{border-color:rgba(58,160,255,.35);}
.pointer{border-top-color:#3aa0ff!important;filter:drop-shadow(0 0 4px rgba(30,144,255,.6));}
#wheelCanvas{box-shadow:0 0 0 3px rgba(30,144,255,.55),0 0 0 6px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5)!important;}
.center-btn{border-color:#3aa0ff!important;color:#eaf4ff!important;box-shadow:0 0 16px rgba(30,144,255,.4)!important;
  background:rgba(4,16,32,.78)!important;}
.tab.active{color:#3aa0ff!important;background:rgba(30,144,255,.14)!important;}
footer.credit .led{background:#1e90ff;box-shadow:0 0 6px #1e90ff;}
#appFX{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
#appFX .aura{position:absolute;left:50%;top:40%;width:220px;height:220px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,#1e90ff 0%,transparent 72%);
  animation:breatheApp 3.6s ease-in-out infinite;}
@keyframes breatheApp{0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(.85);}50%{opacity:.65;transform:translate(-50%,-50%) scale(1.15);}}
#appFX .fog{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(26px);background:#2d5a86;
  opacity:.4;animation:fogDriftApp 11s ease-in-out infinite;}
@keyframes fogDriftApp{0%,100%{transform:translate(-20px,0);}50%{transform:translate(30px,-16px);}}
#appFX .star{position:absolute;border-radius:50%;background:#fff;animation:twinkleApp 2.4s ease-in-out infinite;}
@keyframes twinkleApp{0%,100%{opacity:.15;}50%{opacity:.9;}}
#appFX .gp{position:absolute;bottom:-10px;border-radius:50%;background:#ffd257;opacity:.85;
  animation:floatUpApp linear infinite;}
@keyframes floatUpApp{0%{transform:translateY(0);opacity:0;}10%{opacity:.9;}100%{transform:translateY(-100vh);opacity:0;}}
body.large *{font-size:115%!important;}
header{text-align:center;margin-bottom:4px;}
h1{font-size:1.4rem;margin:6px 0 2px;text-shadow:0 0 14px rgba(255,255,255,.35);}
.sub{text-align:center;font-size:.72rem;opacity:.75;margin:0 0 10px;}
.view{display:none;flex:1;overflow-y:auto;padding-bottom:110px;}
#view-ruleta.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.view.active{display:block;}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:14px;backdrop-filter:blur(16px);margin-bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);}
.card h3{margin:0 0 8px;font-size:.78rem;font-weight:600;letter-spacing:.2px;opacity:.9;}
.prize-photo{width:100%;height:110px;object-fit:cover;border-radius:16px;margin-bottom:8px;display:none;}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;
  padding:8px 14px;border-radius:999px;font-size:.7rem;font-weight:600;cursor:pointer;letter-spacing:.2px;}
.btn:active{background:rgba(255,255,255,.18);}
.btn.active{background:rgba(212,175,55,.9);border-color:rgba(212,175,55,.9);color:#1a1408;font-weight:700;}
.row{display:flex;gap:6px;}
input[type=text],input[type=number],select{flex:1;padding:9px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);color:#fff;font-size:.75rem;min-width:0;}
select{-webkit-appearance:none;appearance:none;}
select option{color:#111;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;
  font-size:.65rem;padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:5px;}
.chip button{background:none;border:none;color:#ffb3b3;font-size:.75rem;cursor:pointer;padding:0;}
.wheel-wrap{display:flex;justify-content:center;margin:8px 0 18px;position:relative;}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid #d4af37;
  filter:drop-shadow(0 0 4px rgba(0,0,0,.5));}
#wheelCanvas{border-radius:50%;box-shadow:0 0 0 3px rgba(212,175,55,.5),0 0 0 6px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5);
  transition:transform 8s cubic-bezier(.1,.6,.15,1);}
.center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;
  border-radius:50%;background:rgba(12,10,8,.75);border:1px solid rgba(212,175,55,.6);color:#f0e4c4;
  font-size:.68rem;font-weight:700;cursor:pointer;z-index:2;letter-spacing:1.5px;box-shadow:0 0 14px rgba(212,175,55,.25);}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 36px);max-width:360px;display:flex;justify-content:space-around;padding:9px 6px;
  background:rgba(18,24,36,.55);backdrop-filter:blur(26px) saturate(180%);border-radius:999px;
  border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22);z-index:5;}
.tab{background:none;border:none;color:#cfcad6;font-size:.95rem;opacity:.6;padding:6px 16px;cursor:pointer;
  border-radius:999px;transition:opacity .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab span{font-size:.6rem;}
.tab.active{opacity:1;font-weight:700;color:#e8cf8a;background:rgba(212,175,55,.12);box-shadow:0 2px 10px rgba(30,144,255,.3);}
footer.credit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.55rem;opacity:.85;letter-spacing:.2px;z-index:4;width:100%;max-width:360px;pointer-events:none;}
footer.credit .led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3fe6a0;margin-right:5px;
  vertical-align:middle;box-shadow:0 0 6px #3fe6a0;animation:ledBlink 1.6s ease-in-out infinite;}
@keyframes ledBlink{0%,100%{opacity:1;box-shadow:0 0 7px #3fe6a0;}50%{opacity:.3;box-shadow:0 0 2px #3fe6a0;}}
footer.credit .ver{opacity:.55;margin-left:6px;}
.hist-item{display:flex;justify-content:space-between;font-size:.72rem;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.1);}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:.78rem;}
.switch{width:40px;height:22px;border-radius:12px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;border:none;}
.switch.on{background:#8a5cff;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:left .2s;}
.switch.on::after{left:20px;}
.font-opt{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  padding:6px 10px;border-radius:10px;font-size:.7rem;cursor:pointer;}
.font-opt.active{background:#8a5cff;border-color:#8a5cff;font-weight:700;}
.grid-themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.theme-swatch{border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;
  border:2px solid transparent;background:rgba(255,255,255,.06);}
.theme-swatch.active{border-color:#fff;}
.theme-swatch .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px;border:1px solid rgba(255,255,255,.3);}
.theme-swatch .tname{font-size:.5rem;line-height:1.1;opacity:.9;}
#overlay{position:fixed;inset:0;background:rgba(3,2,8,.88);display:none;align-items:center;justify-content:center;
  flex-direction:column;z-index:20;text-align:center;padding:20px;}
#overlay.show{display:flex;}
#glitterFx{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.glit{position:absolute;border-radius:50%;animation:twinkle 1.4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6);}50%{opacity:1;transform:scale(1.3);}}
#overlay h2{font-size:2.6rem;margin:8px 0 4px;text-shadow:0 0 24px #fff;}
#overlay h2.pop{animation:numberPop .5s ease;}
@keyframes numberPop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.25);opacity:1;}100%{transform:scale(1);}}
#overlay p{opacity:.95;margin:0 0 18px;font-size:1.5rem;font-weight:700;min-height:1.4em;}
#overlay p.reveal{animation:popIn .45s ease;}
#overlay .gift{font-size:3.4rem;transition:transform .3s;}
#overlay .gift.opening{transform:scale(1.3) rotate(-8deg);}
#overlay #winPrizeImg{display:none;width:240px;max-width:82vw;border-radius:16px;margin:8px 0 16px;
  border:2px solid rgba(255,255,255,.4);box-shadow:0 0 20px rgba(255,255,255,.3);}
#overlay #winPrizeImg.reveal{display:block;animation:popIn .5s ease;}
@keyframes popIn{0%{transform:scale(.4) rotate(-10deg);opacity:0;}70%{transform:scale(1.08) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:25;}
.shake{animation:glitchShake .32s;}
@keyframes glitchShake{
  0%{transform:translate(0,0);}
  15%{transform:translate(-8px,4px) skewX(-2deg);}
  30%{transform:translate(7px,-5px) skewX(2deg);}
  45%{transform:translate(-6px,3px);}
  60%{transform:translate(5px,-3px) skewY(1deg);}
  75%{transform:translate(-3px,2px);}
  100%{transform:translate(0,0);}
}
#prizeModal,#peopleModal,#summaryModal{position:fixed;inset:0;background:rgba(3,2,8,.88);display:none;align-items:center;justify-content:center;
  z-index:22;padding:20px;}
#prizeModal.show,#peopleModal.show,#summaryModal.show{display:flex;}
#prizeModal .box,#peopleModal .box,#summaryModal .box{background:rgba(20,14,40,.9);border:1px solid rgba(255,255,255,.2);border-radius:18px;
  padding:16px;max-width:340px;width:100%;text-align:center;max-height:80vh;overflow-y:auto;}
.wheel-wrap-big{margin-top:0;}
.wheel-wrap-big #wheelCanvas{width:min(86vw,340px);height:min(86vw,340px);}
.wheel-wrap-big .center-btn{width:82px;height:82px;font-size:.82rem;}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1a0e3d,#0a0620);transition:opacity .5s ease;}
#splash img.icon{width:96px;height:96px;border-radius:22px;margin-bottom:14px;
  box-shadow:0 0 30px rgba(168,117,255,.6);}
#splash .stitle{font-size:1.1rem;font-weight:700;color:#e6d9ff;letter-spacing:.5px;}
#splash .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#a875ff;margin:0 1px;
  vertical-align:middle;animation:dotPulse 1.2s infinite;}
#splash .dots span:nth-child(2){animation-delay:.2s;}
#splash .dots span:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}
#splash.hide{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<div id="splash"><img class="icon" id="splashIcon" alt="La Ruleta Decide" src="icon-192.png"><div class="stitle">La Ruleta Decide</div>
  <div class="sub" style="margin-top:6px;">Cargando la ruleta<span class="dots"><span></span><span></span><span></span></span></div></div>
<canvas id="fxCanvas"></canvas>
<div id="prizeModal">
  <div class="box">
    <h3 style="margin-top:0;">Premio</h3>
    <div class="row" style="justify-content:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;" id="prizeTabs"></div>
    <div class="sub" id="prizeTierLabel" style="margin:-4px 0 8px;"></div>
    <img id="prizeImg" class="prize-photo">
    <input type="file" id="prizeInput" accept="image/*" style="display:none">
    <div class="row" style="justify-content:center;">
      <button class="btn" onclick="document.getElementById('prizeInput').click()">Subir foto</button>
      <button class="btn" onclick="closePrize()">Cerrar</button>
    </div>
  </div>
</div>
<div id="overlay">
  <div id="glitterFx"></div>
  <div style="font-size:2.4rem;" id="winGift" class="gift">🎁</div>
  <img id="winPrizeImg">
  <h2 id="winName">-</h2>
  <p id="winNum">-</p>
  <button class="btn" onclick="closeOverlay()">Cerrar</button>
</div>

<div id="app">
<header style="position:relative;">
  <button id="peopleBtn" onclick="openPeople()" style="position:absolute;left:0;top:0;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;">👥</button>
  <button id="prizeBtn" onclick="openPrize()" style="position:absolute;right:0;top:0;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;">🎁</button>
  <h1 data-text="La Ruleta Decide">La Ruleta Decide</h1>
</header>

<div id="view-ruleta" class="view active">
  <div id="roundStatus" style="margin:0 0 10px;display:none;font-size:1rem;font-weight:700;text-align:center;
    letter-spacing:.2px;"></div>
  <div class="wheel-wrap wheel-wrap-big">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
    <button class="center-btn" id="spinBtn" onclick="spin()">GIRAR</button>
  </div>
  <div class="sub" style="margin-top:2px;" id="participantCount"></div>
</div>

<div id="peopleModal">
  <div class="box">
    <h3 style="margin-top:0;">Participantes</h3>
    <div class="row">
      <input type="text" id="pName" placeholder="Nombre (escribí aquí)">
      <select id="pNum" style="max-width:80px;"></select>
      <button class="btn" onclick="addParticipant()">Cargar</button>
    </div>
    <div class="chips" id="chips" style="max-height:260px;overflow-y:auto;"></div>
    <button class="btn" style="margin-top:12px;" onclick="closePeople()">Cerrar</button>
  </div>
</div>

<div id="summaryModal">
  <div class="box">
    <h3 style="margin-top:0;">🏆 Resumen del sorteo</h3>
    <div id="summaryList" style="text-align:left;"></div>
    <button class="btn" style="margin-top:12px;" onclick="closeSummary()">Cerrar</button>
  </div>
</div>

<div id="view-historial" class="view">
  <div class="card">
    <h3>Historial de sorteos</h3>
    <div id="histList"></div>
    <button class="btn" style="margin-top:10px;" onclick="clearHistory()">Borrar historial</button>
  </div>
</div>

<div id="view-ajustes" class="view">
  <div class="card">
    <h3>Tamaño de letra</h3>
    <div class="row" id="fontRow" style="flex-wrap:wrap;gap:6px;"></div>
  </div>
  <div class="card">
    <h3>Cantidad de premios</h3>
    <div class="row" id="prizeCountRow" style="flex-wrap:wrap;gap:6px;"></div>
  </div>
</div>

<footer class="credit"><span class="led"></span>fabricado por Nahuel Rodriguez<span class="ver">v1.0</span></footer>
</div>

<div class="tabbar">
  <button class="tab active" data-v="ruleta" onclick="showView('ruleta')">🎡<span>Ruleta</span></button>
  <button class="tab" data-v="historial" onclick="showView('historial')">🕓<span>Historial</span></button>
  <button class="tab" data-v="ajustes" onclick="showView('ajustes')">⚙️<span>Ajustes</span></button>
</div>

<script>
const demoParticipants = Array.from({length:15}, (_,i)=>({name:'Participante '+(i+1), num:i+1}));
let participants = JSON.parse(localStorage.getItem('rd_participants')|| JSON.stringify(demoParticipants));
let history_ = JSON.parse(localStorage.getItem('rd_history')||'[]');
let colors = ['#7b5cff','#a875ff','#5a35c9','#8f66ef','#33e0ff','#ff6fc6'];

function save(){
  localStorage.setItem('rd_participants', JSON.stringify(participants));
  localStorage.setItem('rd_history', JSON.stringify(history_));
}

function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.v===v));
  if(v==='historial') renderHistory();
}

function buildNumberSelect(){
  const sel=document.getElementById('pNum');
  const used=new Set(participants.map(p=>String(p.num)));
  const prev=sel.value;
  sel.innerHTML='<option value="">N°</option>' + Array.from({length:50},(_,i)=>i+1)
    .filter(n=>!used.has(String(n)))
    .map(n=>`<option value="${n}">${n}</option>`).join('');
  if(Array.from(sel.options).some(o=>o.value===prev)) sel.value=prev;
}
function addParticipant(){
  const name=document.getElementById('pName').value.trim();
  const num=document.getElementById('pNum').value;
  if(!name || !num) return;
  participants.push({name, num});
  document.getElementById('pName').value='';
  save(); renderChips(); drawWheel(); buildNumberSelect();
}
function removeParticipant(i){ participants.splice(i,1); save(); renderChips(); drawWheel(); buildNumberSelect(); }

function renderChips(){
  const c=document.getElementById('chips');
  c.innerHTML='';
  participants.forEach((p,i)=>{
    const el=document.createElement('div'); el.className='chip';
    el.innerHTML = `N°${p.num} <button onclick="removeParticipant(${i})">✕</button>`;
    c.appendChild(el);
  });
  const pc=document.getElementById('participantCount');
  if(pc) pc.textContent = participants.length + ' participantes cargados';
}
function openPeople(){ document.getElementById('peopleModal').classList.add('show'); }
function closePeople(){ document.getElementById('peopleModal').classList.remove('show'); }

let rotation=0;
function drawWheel(){
  const canvas=document.getElementById('wheelCanvas');
  const ctx=canvas.getContext('2d');
  const r=150, cx=150, cy=150;
  ctx.clearRect(0,0,300,300);
  if(participants.length===0){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Agregá participantes', cx, cy);
    return;
  }
  const n=participants.length, slice=Math.PI*2/n;
  participants.forEach((p,i)=>{
    const start=i*slice, end=start+slice;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(start+slice/2);
    ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif';
    ctx.fillText(`N°${p.num}`, r-10, 4);
    ctx.restore();
  });
}

let spinning=false;
function spin(){
  if(spinning || participants.length===0) return;
  let eligible = participants.map((p,i)=>i).filter(i=>!roundWinners.includes(participants[i].num));
  if(eligible.length===0) eligible = participants.map((_,i)=>i); // ya ganaron todos: se reabre el pool
  spinning=true;
  const n=participants.length, slice=360/n;
  const winnerIdx=eligible[Math.floor(Math.random()*eligible.length)];
  // el puntero está arriba (270° en la convención del canvas: 0°=derecha, sentido horario)
  const desired = (((270 - (winnerIdx*slice + slice/2)) % 360) + 360) % 360;
  const current = ((rotation % 360) + 360) % 360;
  let delta = desired - current;
  if(delta <= 0) delta += 360;
  rotation += 360*12 + delta;
  const canvas=document.getElementById('wheelCanvas');
  canvas.style.transform=`rotate(${rotation}deg)`;
  setTimeout(()=>{
    spinning=false;
    const winner=participants[winnerIdx];
    roundWinners.push(winner.num);
    history_.unshift({name:winner.name, num:winner.num, date:new Date().toLocaleString(), tier:currentPrizeTier});
    save();
    showWinner(winner);
  }, 8200);
}

let celebrationInterval=null;
function showWinner(w){
  const nameEl=document.getElementById('winName'), subEl=document.getElementById('winNum');
  nameEl.textContent = ''; nameEl.classList.remove('pop');
  subEl.textContent=''; subEl.classList.remove('reveal');
  const gift=document.getElementById('winGift'), img=document.getElementById('winPrizeImg');
  gift.textContent='🎁'; gift.classList.remove('opening'); gift.style.display='block';
  img.classList.remove('reveal'); img.removeAttribute('style');
  document.getElementById('overlay').classList.add('show');
  spawnGlitter();
  launchCelebration(1);
  if(celebrationInterval) clearInterval(celebrationInterval);
  celebrationInterval=setInterval(()=>{ launchCelebration(Math.ceil(Math.random()*2)); }, 2000);
  // 1) sorpresa: se abre el regalo y se ve la foto del premio primero
  setTimeout(()=>{
    gift.classList.add('opening');
    triggerShake();
    setTimeout(()=>{
      const prize=localStorage.getItem('rd_prize_'+currentPrizeTier);
      gift.style.display='none';
      if(prize){ img.src=prize; img.classList.add('reveal'); }
      else{ gift.textContent='🎉'; gift.style.display='block'; }
    }, 300);
  }, 500);
  // 2) después aparece el número
  setTimeout(()=>{
    nameEl.textContent = 'N°'+w.num;
    void nameEl.offsetWidth; nameEl.classList.add('pop');
    launchCelebration(2);
  }, 1700);
  // 3) por último se revela el nombre del ganador
  setTimeout(()=>{
    subEl.textContent = w.name;
    subEl.classList.add('reveal');
    launchCelebration(2);
  }, 2650);
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
  if(celebrationInterval){ clearInterval(celebrationInterval); celebrationInterval=null; }
  particles=[];
  if(currentPrizeTier < prizeCount){
    selectPrizeTier(currentPrizeTier+1);
    updateRoundStatus();
  } else {
    const roundResults = history_.slice(0, prizeCount).slice().sort((a,b)=>a.tier-b.tier);
    roundWinners=[];
    selectPrizeTier(1);
    updateRoundStatus();
    if(prizeCount>1) showRoundSummary(roundResults);
  }
}
function showRoundSummary(results){
  const box=document.getElementById('summaryList');
  box.innerHTML = results.map(r=>{
    const photo=localStorage.getItem('rd_prize_'+r.tier);
    const thumb = photo
      ? `<img src="${photo}" style="width:48px;height:48px;object-fit:cover;border-radius:10px;margin-right:8px;flex-shrink:0;">`
      : `<div style="width:48px;height:48px;border-radius:10px;margin-right:8px;flex-shrink:0;background:rgba(255,255,255,.08);
          display:flex;align-items:center;justify-content:center;font-size:1.1rem;">🎁</div>`;
    return `<div class="hist-item" style="align-items:center;">
      <span style="display:flex;align-items:center;">${thumb}🏆 ${ordinal(r.tier)} Premio</span>
      <span>N°${r.num} - ${r.name}</span></div>`;
  }).join('');
  document.getElementById('summaryModal').classList.add('show');
}
function closeSummary(){ document.getElementById('summaryModal').classList.remove('show'); }
function spawnGlitter(){
  const gp=['#a875ff','#33e0ff','#ff6fc6','#ffd257','#3fe6a0','#fff'];
  const el=document.getElementById('glitterFx');
  el.innerHTML='';
  for(let i=0;i<40;i++){
    const s=document.createElement('span'); s.className='glit';
    const sz=2+Math.random()*3;
    s.style.width=s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
    s.style.background=gp[i%gp.length];
    s.style.animationDelay=(Math.random()*1.4)+'s';
    el.appendChild(s);
  }
}
let prizeCount = parseInt(localStorage.getItem('rd_prize_count'))||1;
let currentPrizeTier = Math.min(parseInt(localStorage.getItem('rd_prize_tier'))||1, prizeCount);
let roundWinners = [];
function ordinal(n){ return n+'°'; }
function openPrize(){ document.getElementById('prizeModal').classList.add('show'); viewPrizeTab(currentPrizeTier); }
function closePrize(){ document.getElementById('prizeModal').classList.remove('show'); }
let prizeModalTab=1;
function viewPrizeTab(tier){
  prizeModalTab=tier;
  document.querySelectorAll('#prizeTabs .btn').forEach(b=>b.classList.toggle('active', +b.dataset.tier===tier));
  const lbl=document.getElementById('prizeTierLabel');
  if(lbl) lbl.textContent = ordinal(tier)+' Premio';
  const saved=localStorage.getItem('rd_prize_'+tier);
  const img=document.getElementById('prizeImg');
  if(saved){ img.src=saved; img.style.display='block'; } else { img.style.display='none'; }
}
function selectPrizeTier(tier){
  currentPrizeTier=tier;
  localStorage.setItem('rd_prize_tier', tier);
  viewPrizeTab(tier);
}
function buildPrizeTabs(){
  document.getElementById('prizeTabs').innerHTML = Array.from({length:prizeCount},(_,i)=>i+1).map(t=>
    `<button class="btn" data-tier="${t}" onclick="viewPrizeTab(${t})">${t}°</button>`).join('');
}
function updateRoundStatus(){
  const el=document.getElementById('roundStatus');
  if(!el) return;
  if(prizeCount>1){ el.style.display='block'; el.textContent = `Sorteando ${ordinal(currentPrizeTier)} premio de ${prizeCount}`; }
  else { el.style.display='none'; }
}
function applyPrizeCount(n, skipSave){
  prizeCount=n;
  if(!skipSave) localStorage.setItem('rd_prize_count', n);
  document.querySelectorAll('#prizeCountRow .font-opt').forEach(b=>b.classList.toggle('active', +b.dataset.n===n));
  currentPrizeTier=1; roundWinners=[];
  buildPrizeTabs();
  selectPrizeTier(1);
  updateRoundStatus();
}
function buildPrizeCountUI(){
  const r=document.getElementById('prizeCountRow');
  r.innerHTML = Array.from({length:10},(_,i)=>i+1).map(n=>
    `<button class="font-opt" data-n="${n}" onclick="applyPrizeCount(${n})">${n}</button>`).join('');
}

function renderHistory(){
  const el=document.getElementById('histList');
  if(history_.length===0){ el.innerHTML='<div class="sub" style="margin:0;">Todavía no hay sorteos</div>'; return; }
  el.innerHTML = history_.map(h=>{
    const tierTxt = h.tier ? ` <span style="opacity:.55;">(${ordinal(h.tier)} premio)</span>` : '';
    return `<div class="hist-item"><span>🏆 N°${h.num} - ${h.name}${tierTxt}</span><span style="opacity:.6;">${h.date}</span></div>`;
  }).join('');
}
function clearHistory(){ history_=[]; save(); renderHistory(); }

// Temas y tamaños de letra
const FONT_SIZES=[{id:'chica',label:'Chica',pct:85},{id:'normal',label:'Normal',pct:100},
 {id:'grande',label:'Grande',pct:115},{id:'muygrande',label:'Muy grande',pct:135}];

// Estilo único fijo: azul, combinando aura + partículas + diagonal + niebla + estrellas
function rndFx(a,b){return a+Math.random()*(b-a);}
function applyFixedStyle(){
  const app=document.getElementById('app');
  app.style.background='linear-gradient(120deg,#02101f,#0d3a66,#02101f)';
  app.style.backgroundSize='260% 260%';
  app.style.animation='diagMoveApp 10s ease-in-out infinite';
  app.style.color='#f2f6fb';
  colors=['#1e90ff','#063a6e','#3aa0ff','#062544'];
  if(!document.getElementById('appFX')){
    const fx=document.createElement('div'); fx.id='appFX';
    fx.innerHTML = '<div class="aura"></div>';
    for(let i=0;i<3;i++){
      const f=document.createElement('div'); f.className='fog';
      f.style.left=rndFx(5,65)+'%'; f.style.top=rndFx(10,75)+'%';
      f.style.animationDelay=(i*1.3)+'s';
      fx.appendChild(f);
    }
    for(let i=0;i<24;i++){
      const s=document.createElement('div'); s.className='star';
      const sz=rndFx(2,4.2);
      s.style.width=s.style.height=sz+'px';
      s.style.left=rndFx(0,100)+'%'; s.style.top=rndFx(0,85)+'%';
      s.style.animationDelay=rndFx(0,2.4)+'s'; s.style.animationDuration=(1.8+Math.random()*1.6)+'s';
      fx.appendChild(s);
    }
    for(let i=0;i<10;i++){
      const g=document.createElement('div'); g.className='gp';
      const sz=rndFx(4,8);
      g.style.width=g.style.height=sz+'px';
      g.style.left=rndFx(5,95)+'%';
      g.style.animationDuration=rndFx(6,11)+'s';
      g.style.animationDelay=rndFx(0,9)+'s';
      fx.appendChild(g);
    }
    app.insertBefore(fx, app.firstChild);
  }
  drawWheel();
}
function applyFont(pct, skipSave){
  document.documentElement.style.fontSize=pct+'%';
  document.querySelectorAll('.font-opt').forEach(el=>el.classList.toggle('active', +el.dataset.pct===pct));
  if(!skipSave) localStorage.setItem('rd_fontpct', pct);
}
function buildAjustesUI(){
  const fr=document.getElementById('fontRow');
  fr.innerHTML = FONT_SIZES.map(f=>`<button class="font-opt" data-pct="${f.pct}" onclick="applyFont(${f.pct})">${f.label}</button>`).join('');
}

// Foto del premio (por nivel: 1° a 10°) — se comprime antes de guardar para que no falle
// el almacenamiento al cargar fotos para varios premios.
document.getElementById('prizeInput').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const tempImg=new Image();
    tempImg.onload=()=>{
      const maxDim=480;
      let w=tempImg.width, h=tempImg.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(tempImg,0,0,w,h);
      let dataUrl;
      try{ dataUrl=canvas.toDataURL('image/jpeg',0.72); }
      catch(err){ dataUrl=ev.target.result; }
      try{
        localStorage.setItem('rd_prize_'+prizeModalTab, dataUrl);
        const img=document.getElementById('prizeImg'); img.src=dataUrl; img.style.display='block';
      }catch(err){
        alert('No se pudo guardar la foto: se quedó sin espacio en el celular. Borrá alguna foto de otro premio o probá con una imagen más chica.');
      }
    };
    tempImg.onerror=()=>{ alert('No se pudo leer esa imagen, probá con otra foto.'); };
    tempImg.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});
buildPrizeTabs();
selectPrizeTier(currentPrizeTier);

// Confeti + fuegos artificiales
const fx=document.getElementById('fxCanvas'), fctx=fx.getContext('2d');
function resizeFx(){ fx.width=innerWidth; fx.height=innerHeight; }
resizeFx(); addEventListener('resize', resizeFx);
let particles=[];
function triggerShake(){
  const el=document.getElementById('app');
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function launchCelebration(level){
  const confettiCount = level===1?10 : level===2?16 : 22;
  const burstCount = level===1?2 : level===2?3 : 4;
  const palette=['#75AADB','#FFFFFF','#FFD700','#4a90d9','#cfe8ff'];
  triggerShake();
  for(let i=0;i<confettiCount;i++){
    particles.push({x:Math.random()*fx.width, y:-20, vx:(Math.random()-.5)*2, vy:2+Math.random()*3,
      size:4+Math.random()*4, color:palette[Math.floor(Math.random()*palette.length)], rot:Math.random()*360,
      type:'confetti', life:220});
  }
  for(let b=0;b<burstCount;b++){
    setTimeout(()=>{
      const bx=fx.width*(.1+Math.random()*.8);
      const apexY=fx.height*(.12+Math.random()*.35);
      const color=palette[Math.floor(Math.random()*palette.length)];
      particles.push({x:bx,y:fx.height+10,vx:(Math.random()-.5)*0.6,vy:-(9+Math.random()*3),
        size:3,color,type:'rocket',apexY,level,life:200});
    }, b*160);
  }
}
function explode(x,y,level,color,palette){
  triggerShake();
  const rays=level===1?30:level===2?46:70;
  for(let i=0;i<rays;i++){
    const ang=(Math.PI*2/rays)*i;
    const speed=(level===3?8:level===2?6:4.2)+Math.random()*2.5;
    particles.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,
      size:2+Math.random()*2, color:palette[Math.floor(Math.random()*palette.length)],
      type:'spark', life:55+Math.random()*20});
  }
}
const fxPalette=['#75AADB','#FFFFFF','#FFD700','#4a90d9','#cfe8ff'];
function loop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  const toExplode=[];
  particles.forEach(p=>{
    if(p.type==='confetti'){ p.x+=p.vx; p.y+=p.vy; p.rot+=5; p.life--;
      fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.rot*Math.PI/180);
      fctx.fillStyle=p.color; fctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6); fctx.restore();
    } else if(p.type==='rocket'){
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life--;
      fctx.beginPath(); fctx.arc(p.x,p.y,p.size,0,Math.PI*2); fctx.fillStyle=p.color; fctx.fill();
      particles.push({x:p.x+(Math.random()-.5)*2,y:p.y+3,vx:0,vy:0.3,size:1.5,color:p.color,type:'spark',life:14});
      if(p.y<=p.apexY || p.vy>=0){ toExplode.push(p); p.life=0; }
    } else { p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
      fctx.beginPath(); fctx.arc(p.x,p.y,p.size,0,Math.PI*2); fctx.fillStyle=p.color; fctx.fill();
    }
  });
  toExplode.forEach(p=>explode(p.x,p.y,p.level,p.color,fxPalette));
  particles=particles.filter(p=>p.life>0 && p.y<fx.height+30);
  requestAnimationFrame(loop);
}
loop();

// swipe entre tabs
let touchX=0;
document.addEventListener('touchstart', e=>{ touchX=e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)<60) return;
  const order=['ruleta','historial','ajustes'];
  const cur=document.querySelector('.tab.active').dataset.v;
  let idx=order.indexOf(cur);
  idx = dx<0 ? Math.min(idx+1,2) : Math.max(idx-1,0);
  showView(order[idx]);
}, {passive:true});

renderChips(); drawWheel(); buildNumberSelect();
buildAjustesUI(); buildPrizeCountUI();
applyFixedStyle();
applyFont(parseInt(localStorage.getItem('rd_fontpct'))||100, true);
document.querySelectorAll('#prizeCountRow .font-opt').forEach(b=>b.classList.toggle('active', +b.dataset.n===prizeCount));
updateRoundStatus();
setTimeout(()=>{
  const s=document.getElementById('splash'); s.classList.add('hide');
  setTimeout(()=>s.style.display='none', 500);
}, 1400);
</script>
